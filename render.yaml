services:
  # ── Backend (Node/Express) ──────────────────────────────────────────────────
  - type: web
    name: coinpulse-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false          # Set manually in Render dashboard
      - key: JWT_SECRET
        sync: false          # Set manually in Render dashboard
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false          # Set to your Render frontend URL after deploy

  # ── Frontend (React static site) ───────────────────────────────────────────
  - type: web
    name: coinpulse-frontend
    runtime: static
    rootDir: Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        sync: false          # Set to https://coinpulse-api.onrender.com/api/v1
      - key: REACT_APP_COINGECKO_URL
        value: https://api.coingecko.com/api/v3
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
